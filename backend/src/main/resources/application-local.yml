spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:delivery;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    hikari:
      username: sa
      password: ""
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      platform: h2
